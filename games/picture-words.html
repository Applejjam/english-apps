<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Picture Words</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Nunito:wght@800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFF6E8; --card:#FFFFFF; --ink:#2B2A33; --muted:#857E90; --line:#F0E2CC;
    --brand:#FF7A45; --blue:#3D8BFD; --good:#1FAF7A; --bad:#EF4A5E; --yellow:#FFC93C;
  }
  *{box-sizing:border-box}
  body{margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
       font-family:'Jua', 'Noto Sans KR', sans-serif; -webkit-tap-highlight-color:transparent}
  .en{font-family:'Nunito', sans-serif; font-weight:900; letter-spacing:.5px}
  button{font-family:inherit; cursor:pointer; border:none}
  .wrap{max-width:760px; margin:0 auto; padding:16px}

  /* 상단바 */
  .top{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:12px}
  .back{background:var(--card); border:2px solid var(--line); border-radius:999px; padding:8px 14px;
        font-size:16px; color:var(--ink); text-decoration:none}
  .score{background:var(--card); border:2px solid var(--line); border-radius:999px; padding:8px 16px; font-size:18px}

  .screen{display:none} .screen.on{display:block}

  /* 시작 화면 */
  .hero{text-align:center; padding:24px 8px 8px}
  .hero h1{font-size:46px; margin:8px 0 4px; color:var(--brand)}
  .hero p{font-size:20px; color:var(--muted); margin:0 0 24px}
  .hero .pics{font-size:44px; letter-spacing:6px}
  .modes{display:grid; grid-template-columns:repeat(3,1fr); gap:14px}
  .mode{background:var(--card); border:3px solid var(--line); border-radius:24px; padding:22px 10px;
        font-size:22px; color:var(--ink); transition:transform .15s, border-color .15s}
  .mode:hover:not(:disabled){transform:translateY(-4px); border-color:var(--brand)}
  .mode .ico{font-size:48px; display:block; margin-bottom:6px}
  .mode small{display:block; font-size:15px; color:var(--muted); margin-top:4px}
  .mode:disabled{opacity:.45; cursor:not-allowed}
  .note{text-align:center; color:var(--muted); font-size:15px; margin-top:14px; min-height:20px}

  /* 게임 화면 */
  .bar{height:12px; background:var(--line); border-radius:99px; overflow:hidden; margin-bottom:6px}
  .bar i{display:block; height:100%; width:0; background:var(--brand); border-radius:99px; transition:width .3s}
  .count{text-align:right; color:var(--muted); font-size:15px; margin-bottom:10px}
  .card{background:var(--card); border:3px solid var(--line); border-radius:32px; padding:20px; text-align:center; position:relative}
  .emoji{font-size:150px; line-height:1.15; display:inline-block}
  .pop{animation:pop .35s ease}
  @keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
  .listen{position:absolute; top:14px; right:14px; background:#EAF2FF; color:var(--blue);
          border-radius:999px; padding:8px 14px; font-size:17px}
  .reveal{font-size:44px; color:var(--good); min-height:58px; margin-top:4px}

  .controls{margin-top:16px}
  .choices{display:grid; grid-template-columns:repeat(3,1fr); gap:12px}
  .choice{background:var(--card); border:3px solid var(--line); border-radius:20px; padding:20px 6px; font-size:28px; color:var(--ink)}
  .choice:hover:not(:disabled){border-color:var(--blue)}
  .choice.right{background:var(--good); border-color:var(--good); color:#fff}
  .choice.wrong{background:#FFE6E9; border-color:var(--bad); color:var(--bad)}

  .typebox{display:flex; gap:10px}
  .typebox input{flex:1; min-width:0; font-size:32px; padding:14px 18px; border:3px solid var(--line); border-radius:20px;
                 outline:none; text-align:center; background:var(--card); color:var(--ink)}
  .typebox input:focus{border-color:var(--blue)}
  .btn{border-radius:20px; padding:14px 20px; font-size:20px; color:#fff; background:var(--blue)}
  .btn.soft{background:var(--card); color:var(--ink); border:3px solid var(--line)}
  .btn.go{background:var(--brand)}
  .blanks{text-align:center; font-size:30px; color:var(--muted); margin:12px 0 0; letter-spacing:6px; min-height:40px}

  .mic{display:block; margin:0 auto; width:130px; height:130px; border-radius:50%; background:var(--brand); color:#fff; font-size:56px;
       box-shadow:0 8px 0 #D95F2E}
  .mic:active{transform:translateY(4px); box-shadow:0 4px 0 #D95F2E}
  .mic.on{background:var(--bad); box-shadow:0 8px 0 #B83244; animation:pulse 1s infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
  .heard{text-align:center; margin-top:14px; font-size:18px; color:var(--muted); min-height:26px}

  .feedback{text-align:center; font-size:26px; min-height:38px; margin:14px 0 4px}
  .feedback.good{color:var(--good)} .feedback.bad{color:var(--bad)}
  .shake{animation:shake .35s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
  .actions{display:flex; justify-content:center; gap:10px; margin-top:6px}
  .hide{display:none !important}

  /* 결과 화면 */
  .result{text-align:center; padding:30px 10px}
  .result .stars{font-size:70px}
  .result h2{font-size:40px; margin:10px 0 4px}
  .result p{font-size:22px; color:var(--muted)}
  .result .actions{margin-top:22px; flex-wrap:wrap}

  @media (max-width:560px){
    .modes{grid-template-columns:1fr}
    .emoji{font-size:110px}
    .choices{grid-template-columns:1fr}
    .hero h1{font-size:38px}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <a class="back" href="../index.html">← 목록</a>
    <div class="score">⭐ <span id="score">0</span></div>
  </div>

  <!-- 1. 시작 화면 -->
  <section id="start" class="screen on">
    <div class="hero">
      <div class="pics">🍎🐱☀️</div>
      <h1 class="en">Picture Words</h1>
      <p>그림을 보고 영어 단어를 맞혀요!</p>
    </div>
    <div class="modes">
      <button class="mode" data-mode="click"><span class="ico">🖱️</span>골라요<small>마우스로 단어 고르기</small></button>
      <button class="mode" data-mode="type"><span class="ico">⌨️</span>써요<small>키보드로 단어 쓰기</small></button>
      <button class="mode" data-mode="voice" id="voiceMode"><span class="ico">🎤</span>말해요<small>목소리로 단어 말하기</small></button>
    </div>
    <div class="note" id="voiceNote"></div>
  </section>

  <!-- 2. 게임 화면 -->
  <section id="play" class="screen">
    <div class="bar"><i id="bar"></i></div>
    <div class="count" id="count">1 / 10</div>

    <div class="card" id="card">
      <button class="listen" id="listen">🔊 들어보기</button>
      <div class="emoji" id="emoji">🍎</div>
      <div class="reveal en" id="reveal"></div>
    </div>

    <div class="controls" id="controls"></div>
    <div class="feedback" id="feedback"></div>
    <div class="actions">
      <button class="btn soft" id="skip">넘어가기</button>
      <button class="btn go hide" id="next">다음 ▶</button>
    </div>
  </section>

  <!-- 3. 결과 화면 -->
  <section id="end" class="screen">
    <div class="result">
      <div class="stars" id="stars">⭐⭐⭐</div>
      <h2 id="endTitle">Great job!</h2>
      <p id="endText">10개 중 8개를 맞혔어요</p>
      <div class="actions">
        <button class="btn go" id="again">다시 하기</button>
        <button class="btn soft" id="toStart">다른 방법으로 하기</button>
      </div>
    </div>
  </section>
</div>

<script>
/* =========================================================
   ✏️ 선생님 수정 구역
   - 단어(word)와 그림(emoji)을 바꾸면 우리 반 단어 게임이 됩니다.
   - 이모지는 윈도우 [윈도우키 + .] / 맥 [Ctrl+Cmd+Space] 로 넣을 수 있어요.
   - ROUNDS: 한 판에 나오는 문제 수
   ========================================================= */
const WORDS = [
  { word: "apple",     emoji: "🍎" },
  { word: "banana",    emoji: "🍌" },
  { word: "cat",       emoji: "🐱" },
  { word: "dog",       emoji: "🐶" },
  { word: "egg",       emoji: "🥚" },
  { word: "fish",      emoji: "🐟" },
  { word: "grapes",    emoji: "🍇" },
  { word: "hat",       emoji: "🎩" },
  { word: "ice cream", emoji: "🍦" },
  { word: "lion",      emoji: "🦁" },
  { word: "milk",      emoji: "🥛" },
  { word: "pizza",     emoji: "🍕" },
  { word: "rabbit",    emoji: "🐰" },
  { word: "sun",       emoji: "☀️" },
  { word: "tiger",     emoji: "🐯" },
  { word: "umbrella",  emoji: "☂️" }
];
const ROUNDS = 10;
/* ========================================================= */

const $ = s => document.querySelector(s);
let mode, deck, idx, score, solved, hintCount, firstTry;

/* ---------- 도구 ---------- */
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
function norm(s){ return s.toLowerCase().replace(/[^a-z\s]/g," ").replace(/\s+/g," ").trim(); }
function show(id){ document.querySelectorAll(".screen").forEach(s=>s.classList.remove("on")); $("#"+id).classList.add("on"); }

/* 효과음 (파일 없이 브라우저에서 직접 만듦) */
let actx;
function tone(freqs){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const t = actx.currentTime;
    freqs.forEach((f,i)=>{
      const o=actx.createOscillator(), g=actx.createGain(), s=t+i*0.12;
      o.type="sine"; o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,s); g.gain.exponentialRampToValueAtTime(0.25,s+0.02); g.gain.exponentialRampToValueAtTime(0.0001,s+0.2);
      o.connect(g).connect(actx.destination); o.start(s); o.stop(s+0.22);
    });
  }catch(e){}
}
const goodSound = ()=>tone([523,659,784]);
const badSound  = ()=>tone([260,200]);

/* 영어 읽어주기 (브라우저 내장 TTS) */
let enVoice=null;
function pickVoice(){
  const vs = speechSynthesis.getVoices();
  enVoice = vs.find(v=>v.lang==="en-US" && /Google|Samantha|Microsoft/i.test(v.name)) || vs.find(v=>v.lang && v.lang.startsWith("en")) || null;
}
if("speechSynthesis" in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(text){
  if(!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang="en-US"; if(enVoice) u.voice=enVoice; u.rate=0.85;
  speechSynthesis.speak(u);
}

/* 음성 인식 지원 확인 */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if(!SR){
  $("#voiceMode").disabled = true;
  $("#voiceNote").textContent = "🎤 말해요는 크롬(Chrome) 브라우저에서 사용할 수 있어요.";
}

/* ---------- 게임 흐름 ---------- */
document.querySelectorAll(".mode").forEach(b=>b.addEventListener("click",()=>startGame(b.dataset.mode)));

function startGame(m){
  mode = m;
  deck = shuffle([...WORDS]).slice(0, Math.min(ROUNDS, WORDS.length));
  idx = 0; score = 0; $("#score").textContent = 0;
  show("play"); newRound();
}

function newRound(){
  if(idx >= deck.length) return endGame();
  const item = deck[idx];
  solved=false; hintCount=0; firstTry=true;

  $("#bar").style.width = (idx/deck.length*100)+"%";
  $("#count").textContent = `${idx+1} / ${deck.length}`;
  const em = $("#emoji"); em.textContent = item.emoji; em.classList.remove("pop"); void em.offsetWidth; em.classList.add("pop");
  $("#reveal").textContent = "";
  setFeedback("", "");
  $("#skip").classList.remove("hide"); $("#next").classList.add("hide");

  const c = $("#controls"); c.innerHTML = "";
  if(mode==="click") buildChoices(c, item);
  if(mode==="type")  buildTyping(c, item);
  if(mode==="voice") buildVoice(c, item);
}

function setFeedback(text, cls){ const f=$("#feedback"); f.textContent=text; f.className="feedback "+cls; }

function success(earned, msg){
  if(solved) return;
  solved = true;
  if(earned){ score++; $("#score").textContent = score; }
  goodSound();
  const praise = ["Great! 🎉","Good job! 👍","Excellent! 🌟","Wonderful! 🙌","Perfect! 💯"];
  setFeedback(msg || praise[Math.floor(Math.random()*praise.length)], "good");
  finishRound();
}

function fail(msg){
  badSound(); firstTry=false;
  setFeedback(msg, "bad");
  const card=$("#card"); card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake");
}

function finishRound(){
  const item = deck[idx];
  $("#reveal").textContent = item.word;
  setTimeout(()=>speak(item.word), 300);
  $("#controls").querySelectorAll("button, input").forEach(el=>el.disabled=true);
  $("#skip").classList.add("hide"); $("#next").classList.remove("hide");
  $("#next").focus();
}

$("#skip").addEventListener("click",()=>{
  if(solved) return; solved=true;
  setFeedback("괜찮아요! 같이 읽어 봐요 😊", "");
  finishRound();
});
$("#next").addEventListener("click",()=>{ idx++; newRound(); });
$("#listen").addEventListener("click",()=>speak(deck[idx].word));

function endGame(){
  $("#bar").style.width = "100%";
  const r = score/deck.length;
  $("#stars").textContent = r>=0.9 ? "⭐⭐⭐" : r>=0.6 ? "⭐⭐" : r>=0.3 ? "⭐" : "💪";
  $("#endTitle").textContent = r>=0.9 ? "Amazing!" : r>=0.6 ? "Great job!" : "Nice try!";
  $("#endText").textContent = `${deck.length}개 중 ${score}개를 맞혔어요`;
  show("end"); tone([523,659,784,1047]);
}
$("#again").addEventListener("click",()=>startGame(mode));
$("#toStart").addEventListener("click",()=>show("start"));

/* ---------- 🖱️ 골라요 (첫 번째에 맞히면 점수) ---------- */
function buildChoices(c, item){
  const others = shuffle(WORDS.filter(w=>w.word!==item.word)).slice(0,2).map(w=>w.word);
  const opts = shuffle([item.word, ...others]);
  const box = document.createElement("div"); box.className="choices";
  opts.forEach(w=>{
    const b=document.createElement("button"); b.className="choice en"; b.textContent=w;
    b.onclick=()=>{
      if(w===item.word){ b.classList.add("right"); success(firstTry); }
      else { b.classList.add("wrong"); b.disabled=true; fail("다시 골라 볼까요?"); }
    };
    box.appendChild(b);
  });
  c.appendChild(box);
}

/* ---------- ⌨️ 써요 ---------- */
function buildTyping(c, item){
  c.innerHTML = `
    <div class="typebox">
      <input id="typed" class="en" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="type here">
      <button class="btn" id="check">확인</button>
    </div>
    <div class="blanks en" id="blanks"></div>
    <div class="actions"><button class="btn soft" id="hint">💡 힌트</button></div>`;
  const input=$("#typed");
  const showBlanks=()=>{
    $("#blanks").textContent = [...item.word].map((ch,i)=> ch===" " ? " / " : (i<hintCount ? ch : "_")).join(" ");
  };
  showBlanks();
  const check=()=>{
    if(solved) return;
    if(!input.value.trim()) return;
    if(norm(input.value)===norm(item.word)){ success(true); }
    else { fail("철자를 다시 확인해 볼까요?"); input.select(); }
  };
  $("#check").onclick=check;
  input.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); e.stopPropagation(); check(); } });
  $("#hint").onclick=()=>{ if(hintCount<item.word.length){ hintCount++; if(item.word[hintCount-1]===" ") hintCount++; showBlanks(); input.focus(); } };
  setTimeout(()=>input.focus(), 50);
}

/* ---------- 🎤 말해요 ---------- */
let rec=null, listening=false;
function buildVoice(c, item){
  c.innerHTML = `<button class="mic" id="mic">🎤</button><div class="heard" id="heard">마이크를 누르고 영어로 말해 보세요</div>`;
  $("#mic").onclick=()=>listen(item);
}
function matches(said, target){
  const p=" "+said+" ";
  return p.includes(" "+target+" ") || p.includes(" "+target+"s ") || said.replace(/\s/g,"")===target.replace(/\s/g,"");
}
function listen(item){
  if(solved) return;
  if(listening && rec){ rec.stop(); return; }
  if("speechSynthesis" in window) speechSynthesis.cancel();
  rec = new SR();
  rec.lang="en-US"; rec.interimResults=false; rec.maxAlternatives=5;
  rec.onstart=()=>{ listening=true; $("#mic").classList.add("on"); $("#heard").textContent="듣고 있어요... 말해 보세요!"; };
  rec.onresult=e=>{
    const alts=[...e.results[0]].map(r=>r.transcript);
    const target=norm(item.word);
    const ok=alts.some(t=>matches(norm(t), target));
    $("#heard").textContent = `들린 말: "${alts[0]}"`;
    if(ok) success(true);
    else fail("다시 한번 말해 볼까요? 🔊 들어보기도 눌러 보세요");
  };
  rec.onerror=e=>{
    const msg = e.error==="no-speech" ? "소리가 들리지 않았어요. 다시 눌러 주세요."
              : e.error==="not-allowed" ? "마이크 사용을 허용해 주세요. (파일을 직접 열었다면 깃허브 주소로 접속해 보세요)"
              : e.error==="network" ? "인터넷 연결을 확인해 주세요."
              : "다시 한번 눌러 주세요.";
    $("#heard").textContent = msg;
  };
  rec.onend=()=>{ listening=false; const m=$("#mic"); if(m) m.classList.remove("on"); };
  rec.start();
}

/* 엔터 키로 다음 문제 */
document.addEventListener("keydown",e=>{
  if(e.key==="Enter" && $("#play").classList.contains("on") && solved){ e.preventDefault(); $("#next").click(); }
});
</script>
</body>
</html>
